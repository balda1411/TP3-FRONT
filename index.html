    <title>Document</title>

    <header>
      <select id="filtroLenguaje"></select>
      <select id="filtrotipo"></select>
      <select id="filtrogenero"></select>
      <input type="search" id="Buscar" placeholder="filtrar por" />
    </header>
    <section class="todo">
      <main id="series-Container"></main>
      <form id="agregarPelis">
        <label for="name">Nombre De La Pelicula</label>
        <input type="text" id="nombre" name="name" />
        <label for="language">Lenguaje De La Pelicula</label>
        <input type="text" id="lenguaje" name="language" />
        <label for="type">Tipo De Pelicula</label>
        <input type="text" id="tipo" name="type" />
        <button type="submit" id="agregarPelisBoton">Agregar</button>
      </form>
    </section>
    <script src="script.js"></script>
